services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: linkvault
      POSTGRES_PASSWORD: localdev-only
      POSTGRES_DB: linkvault
    ports:
      - "5432:5432"
    volumes:
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
