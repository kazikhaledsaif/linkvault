<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LinkVault</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 720px; margin: 2rem auto; padding: 0 1rem; }
    form { display: flex; gap: .5rem; } input { flex: 1; padding: .5rem; } button { padding: .5rem 1rem; }
    li { margin: .5rem 0; } .s { font-size: .8rem; padding: 0 .4rem; border-radius: 4px; background: #eee; }
  </style>
</head>
<body>
  <h1>LinkVault</h1>
  <!-- Placeholder page. The React app replaces this in Step 13 (S3 + CloudFront). -->
  <form id="f"><input id="u" type="url" placeholder="https://example.com" required /><button>Save</button></form>
  <ul id="list"></ul>
  <script>
    const API = location.port === "5500" ? "http://localhost:3000" : "/api";
    async function load() {
      const items = await (await fetch(API + "/items")).json();
      document.getElementById("list").innerHTML = items.map(i =>
        `<li><span class="s">${i.status}</span> ${i.title ?? ""} <br><small>${i.url}</small></li>`).join("");
    }
    document.getElementById("f").onsubmit = async (e) => {
      e.preventDefault();
      await fetch(API + "/items", { method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({ url: document.getElementById("u").value }) });
      e.target.reset(); load();
    };
    load(); setInterval(load, 3000);
  </script>
</body>
</html>
